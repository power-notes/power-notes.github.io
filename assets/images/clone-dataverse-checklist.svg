      <text x="0" y="34" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">9</text>
      <text x="0" y="60" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">9. Mask PII</text>
