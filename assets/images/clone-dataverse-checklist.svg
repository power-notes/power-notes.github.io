    <ellipse rx="40" ry="100" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.4" />
    <path d="M-100,0 H100 M0,-100 V100" stroke="#00e5ff" stroke-width="1" opacity="0.3" />

    <!-- Labels Inside Source -->
    <g fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">
